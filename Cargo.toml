[package]
name = "cryptox"
version = "0.1.0"
edition = "2024"

[dependencies]
bcrypt = { version = "0.18.0", optional = true }
uuid = { version = "1.21.0", features = ["v4", "v7"], optional = true }
sha2 = { version = "0.10.9", optional = true }

[[example]]
name = "main"

[features]

hash = ["dep:sha2"]
uuid = ["dep:uuid"]
bcrypt = ["dep:bcrypt"]

full = ["hash", "uuid", "bcrypt"]

default = []